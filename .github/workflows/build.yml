name: Build Ghostty

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Opsional: auto-check tiap Senin jam 04:00 UTC

jobs:
  build:
    name: Build & Publish Pacman Repo
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup cache & output directories
        run: |
          mkdir -p dist .cache/zig .cache/pacman
          chmod -R 777 dist .cache

      - name: Cache Zig & Pacman
        uses: actions/cache@v4
        with:
          path: |
            .cache/zig
            .cache/pacman
          key: ghostty-build-${{ runner.os }}-${{ hashFiles('PKGBUILD', 'scripts/build.sh') }}-${{ github.run_id }}
          restore-keys: |
            ghostty-build-${{ runner.os }}-${{ hashFiles('PKGBUILD', 'scripts/build.sh') }}-
            ghostty-build-${{ runner.os }}-

      - name: Get previous release commit
        id: prev_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_SHA=$(gh release view repo --repo "$GITHUB_REPOSITORY" --json body -q '.body' 2>/dev/null | grep -o 'commit/[a-f0-9]\{40\}' | head -n1 | cut -d/ -f2 || true)
          echo "prev_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"

      - name: Build Ghostty & Generate Pacman Repo in Arch container
        run: |
          chmod -R 777 dist .cache
          docker run --rm \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            -e PREV_SHA="${{ steps.prev_release.outputs.prev_sha }}" \
            -v "$PWD:/workspace" \
            -v "$PWD/dist:/dist" \
            -v "$PWD/.cache/zig:/home/builder/.cache/zig" \
            -v "$PWD/.cache/pacman:/var/cache/pacman/pkg" \
            archlinux:base-devel bash /workspace/scripts/build.sh

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-packages
          path: dist/*
          retention-days: 7

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TITLE=$(cat dist/release_title.txt 2>/dev/null || echo "Ghostty Pacman Repository")

          # Check if release 'repo' already exists
          if ! gh release view repo --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Delete stale tag if left behind without a release
            git push origin :refs/tags/repo >/dev/null 2>&1 || true

            gh release create repo dist/*.pkg.tar.zst dist/ghostty.db dist/ghostty.db.tar.gz dist/ghostty.files dist/ghostty.files.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file dist/release_notes.md
          else
            gh release edit repo \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes-file dist/release_notes.md

            gh release upload repo dist/*.pkg.tar.zst dist/ghostty.db dist/ghostty.db.tar.gz dist/ghostty.files dist/ghostty.files.tar.gz \
              --clobber --repo "$GITHUB_REPOSITORY"

            # Prune obsolete assets not present in current build
            current_files=$(cd dist && ls -1 *.pkg.tar.zst ghostty.db* ghostty.files*)
            assets=$(gh release view repo --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for asset in $assets; do
              case "$current_files" in
                *"$asset"*) ;;
                *)
                  echo "Pruning old asset: $asset"
                  gh release delete-asset repo "$asset" --repo "$GITHUB_REPOSITORY" --yes || true
                  ;;
              esac
            done
          fi
