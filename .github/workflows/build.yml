name: Build Ghostty

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # Opsional: auto-check tiap Senin jam 04:00 UTC

jobs:
  build:
    name: Build & Publish Pacman Repo
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Ghostty & Generate Pacman Repo in Arch container
        run: |
          mkdir -p dist
          chmod 777 dist

          docker run --rm \
            -v "$PWD/dist:/dist" \
            archlinux:base-devel bash -c '
              set -euo pipefail

              # Update keyring and install prerequisites
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Su --noconfirm --needed git sudo pacman

              # Setup unprivileged user for makepkg
              useradd -m -s /bin/bash builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder

              # Build packages and generate pacman database
              su builder -c "
                git clone https://aur.archlinux.org/ghostty-git.git /tmp/ghostty-git
                cd /tmp/ghostty-git

                # Allow zig to fetch missing transitive dependencies online
                sed -i \"/--system/d\" PKGBUILD

                makepkg -s --noconfirm
                cp *.pkg.tar.zst /dist/
                cd /dist
                repo-add ghostty.db.tar.gz *.pkg.tar.zst
                # Ensure db and files are physical files, not symlinks
                rm -f ghostty.db ghostty.files
                cp -a ghostty.db.tar.gz ghostty.db
                cp -a ghostty.files.tar.gz ghostty.files
              "
            '

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-packages
          path: dist/*
          retention-days: 7

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view repo --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create repo dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Ghostty Pacman Repository" \
              --notes "Automated Pacman repository tracking ghostty-org/ghostty main."
          else
            gh release upload repo dist/* --clobber --repo "$GITHUB_REPOSITORY"

            # Prune obsolete assets not present in current build
            current_files=$(cd dist && ls -1)
            assets=$(gh release view repo --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for asset in $assets; do
              case "$current_files" in
                *"$asset"*) ;;
                *)
                  echo "Pruning old asset: $asset"
                  gh release delete-asset repo "$asset" --repo "$GITHUB_REPOSITORY" --yes || true
                  ;;
              esac
            done
          fi
